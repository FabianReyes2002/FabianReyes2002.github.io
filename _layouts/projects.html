---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  <p class="muted">{{ page.when }} · {{ page.tools | join: " · " }}</p>
  {% if page.cover %}<img src="{{ page.cover }}" alt="" style="max-width:100%;border-radius:12px;margin:1rem 0">{% endif %}
  {{ content }}
  {% if page.links %}
    <h3>Links</h3>
    <ul>
      {% for l in page.links %}
      <li><a href="{{ l.url }}" target="_blank" rel="noopener">{{ l.label }}</a></li>
      {% endfor %}
    </ul>
  {% endif %}
